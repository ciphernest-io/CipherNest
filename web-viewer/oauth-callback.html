<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Returning to CipherNest</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #0e1013; color: #e8eaed;
           font-family: system-ui, sans-serif; }
    .card { text-align: center; padding: 32px; }
    a.btn { display: inline-block; margin-top: 20px; padding: 14px 28px;
            background: #4c8dff; color: #fff; border-radius: 12px;
            text-decoration: none; font-weight: 600; }
    p { color: #9aa0a6; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Fallback ONLY for the brief window after install before Android has
       verified the App Link. Once verified, the redirect routes straight
       into the app and this page never renders. The button re-fires the
       same https URL as an explicit, package-targeted app intent so it
       reaches CallbackActivity's https filter (the plugin waits on the
       'https' scheme). The code in the URL is single-use and short-lived;
       this page is ours and sends nothing anywhere. -->
  <div class="card">
    <h2>Sign-in complete</h2>
    <p>Finishing up in the CipherNest app.<br>
       If it doesn't reopen on its own, tap below.</p>
    <a class="btn" id="open" href="#">Open CipherNest</a>
  </div>
  <script>
    var target = 'intent://' + location.host + location.pathname +
      location.search +
      '#Intent;scheme=https;package=com.example.frontend;end';
    document.getElementById('open').setAttribute('href', target);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Returning to CipherNest</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #0e1013; color: #e8eaed;
           font-family: system-ui, sans-serif; }
    .card { text-align: center; padding: 32px; }
    a.btn { display: inline-block; margin-top: 20px; padding: 14px 28px;
            background: #4c8dff; color: #fff; border-radius: 12px;
            text-decoration: none; font-weight: 600; }
    p { color: #9aa0a6; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Chrome renders the in-tab OAuth redirect itself (App Links don't
       intercept in-browser navigation), so this page IS the expected final
       step of sign-in, not an error state. It hands the auth code to the
       app via a CUSTOM-scheme intent (ciphernest://): Chrome refuses to
       launch app intents whose embedded scheme is http/https (redirect-loop
       guard), so scheme=https silently does nothing. A custom scheme
       launches reliably, and the app's plugin waits on exactly this scheme.
       The code in the URL is single-use and short-lived; this page is ours
       and sends nothing anywhere.
       We try once automatically on load, and the button is the manual
       retry (a tap is a fresh user gesture if the auto-attempt was too
       early). -->
  <div class="card">
    <h2>Sign-in complete</h2>
    <p>Finishing up in the CipherNest app.<br>
       If it doesn't reopen on its own, tap below.</p>
    <a class="btn" id="open" href="#">Open CipherNest</a>
  </div>
  <script>
    // Preserve the OAuth query (code/state) but re-key the scheme to the
    // custom one the app's flutter_web_auth callback is registered under.
    var target = 'intent://oauth-callback' + location.search +
      '#Intent;scheme=ciphernest;package=com.example.frontend;end';
    document.getElementById('open').setAttribute('href', target);
    // Custom-scheme intents are allowed to auto-launch in Chrome; unlike the
    // https variant this does not destabilize the tab.
    window.location.href = target;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Returning to CipherNest…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #0e1013; color: #e8eaed;
           font-family: system-ui, sans-serif; }
    .card { text-align: center; padding: 32px; }
    a.btn { display: inline-block; margin-top: 20px; padding: 14px 28px;
            background: #4c8dff; color: #fff; border-radius: 12px;
            text-decoration: none; font-weight: 600; }
    p { color: #9aa0a6; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Chrome renders in-tab OAuth redirects itself (App Links don't
       intercept in-browser navigation), so this page IS the expected final
       step of sign-in, not an error state. It must stay perfectly still and
       wait for one tap: any scripted navigation to an app intent lacks a
       user gesture, and Chrome's block of it destabilizes the tab (the
       flash-and-bounce bug). The button tap is the gesture that makes the
       hand-off legal. The code in the URL is single-use and short-lived;
       this page is ours and sends nothing anywhere. -->
  <div class="card">
    <h2>Sign-in complete</h2>
    <p>One more tap to finish connecting your account.<br>
       (Don't use the back button — tap below.)</p>
    <a class="btn" id="open" href="#">Open CipherNest</a>
  </div>
  <script>
    // Re-present the SAME https URL as an explicit app intent: the plugin
    // keys its pending sign-in on the redirect's scheme ('https'), and an
    // explicit package-targeted intent matches the app's intent-filter even
    // when App Link auto-verification failed. NO auto-navigation — see
    // comment above.
    var target = 'intent://' + location.host + location.pathname +
      location.search +
      '#Intent;scheme=https;package=com.example.frontend;end';
    document.getElementById('open').setAttribute('href', target);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Returning to CipherNest</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #0e1013; color: #e8eaed;
           font-family: system-ui, sans-serif; }
    .card { text-align: center; padding: 32px; }
    a.btn { display: inline-block; margin-top: 20px; padding: 14px 28px;
            background: #4c8dff; color: #fff; border-radius: 12px;
            text-decoration: none; font-weight: 600; }
    p { color: #9aa0a6; font-size: 14px; }
  </style>
</head>
<body>
  <!-- This page is the ALWAYS-rendered final step of sign-in (the app does
       not claim this URL, on purpose - see CallbackActivity in the app
       manifest). The button converts the https redirect into a custom-
       scheme app intent: Chrome dispatches those on a user gesture, and
       never dispatches http/https ones. No scripted auto-navigation:
       without a gesture Chrome blocks it and can destabilize the tab.

       Scheme is ciphernest-open (MainActivity's relay filter), NOT the
       plugin's ciphernest: targeting MainActivity brings the APP task to
       the foreground, and it relays the URI to the plugin's
       CallbackActivity internally. Targeting CallbackActivity directly
       left the user stranded in this tab (separate task +
       finishAndRemoveTask). The code in the URL is single-use and
       short-lived; this page is ours and sends nothing anywhere. -->
  <div class="card">
    <h2>Sign-in complete</h2>
    <p>Tap the button to return to CipherNest.</p>
    <a class="btn" id="open" href="#">Open CipherNest</a>
  </div>
  <script>
    var target = 'intent://oauth-callback' + location.search +
      '#Intent;scheme=ciphernest-open;package=com.example.frontend;end';
    document.getElementById('open').setAttribute('href', target);
  </script>
</body>
</html>

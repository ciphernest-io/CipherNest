<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Soft dark-aware shadows" viewport="700x130" -->
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.sw{display:flex;flex-direction:column;gap:7px;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font);color:var(--fg-muted);font-family:var(--font-mono);}
</style></head><body><div class="wrap">
<div class="swatches">
<div class="chip" style="width:130px;"><div style="height:64px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,0.4);"></div><div class="nm">elevation/sm</div></div><div class="chip" style="width:130px;"><div style="height:64px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.45);"></div><div class="nm">elevation/md</div></div><div class="chip" style="width:130px;"><div style="height:64px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 18px 48px rgba(0,0,0,0.55);"></div><div class="nm">elevation/lg</div></div>
</div></div></body></html>

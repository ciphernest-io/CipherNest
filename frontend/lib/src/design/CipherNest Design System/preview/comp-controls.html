<!DOCTYPE html>

<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">

<style>html,body{margin:0;background:var(--bg);}

<!DOCTYPE html>
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font-mono);color:var(--fg-muted);}
</style></head><body><div class="wrap">
<div style="display:flex;flex-direction:column;gap:11px;">
<div style="display:flex;align-items:baseline;gap:14px;"><span style="font:700 32px/1 var(--font);letter-spacing:-0.02em;">Display</span><span class="hex" style="color:var(--fg-muted);">Hanken · 32 / 700</span></div>
<div style="display:flex;align-items:baseline;gap:14px;"><span style="font:700 28px/1 var(--font);letter-spacing:-0.018em;">Title</span><span class="hex" style="color:var(--fg-muted);">28 / 700</span></div>
<div style="display:flex;align-items:baseline;gap:14px;"><span style="font:600 22px/1 var(--font);">Section H2</span><span class="hex" style="color:var(--fg-muted);">22 / 600</span></div>
<div style="display:flex;align-items:baseline;gap:14px;"><span style="font:600 17px/1 var(--font);">Row title H3</span><span class="hex" style="color:var(--fg-muted);">17 / 600</span></div>
<div style="display:flex;align-items:baseline;gap:14px;"><span style="font:400 15px/1 var(--font);">Body text</span><span class="hex" style="color:var(--fg-muted);">15 / 400</span></div>
<div style="display:flex;align-items:baseline;gap:14px;"><span style="font:500 13px/1 var(--font-mono);color:var(--accent);">recovery · AES-256-GCM</span><span class="hex" style="color:var(--fg-muted);">Mono · IBM Plex</span></div>
<div style="display:flex;align-items:baseline;gap:14px;"><span style="font:600 11px/1 var(--font);letter-spacing:0.09em;text-transform:uppercase;color:var(--fg-muted)">Overline · Date</span><span class="hex" style="color:var(--fg-muted);">11 / 600</span></div>
</div></div></body></html>

<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner Radii" subtitle="8 input · 14 card · 22 sheet · 999 pill" viewport="700x130" -->
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.sw{display:flex;flex-direction:column;gap:7px;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font);color:var(--fg-muted);font-family:var(--font-mono);}
</style></head><body><div class="wrap">
<div class="swatches" style="align-items:flex-end;">
<div class="chip" style="width:96px;"><div style="height:60px;background:var(--surface);border:1px solid var(--hairline);border-radius:8px;"></div><div class="nm">Input</div><div class="hex">8px</div></div><div class="chip" style="width:96px;"><div style="height:60px;background:var(--surface);border:1px solid var(--hairline);border-radius:14px;"></div><div class="nm">Card</div><div class="hex">14px</div></div><div class="chip" style="width:96px;"><div style="height:60px;background:var(--surface);border:1px solid var(--hairline);border-radius:18px;"></div><div class="nm">Card L</div><div class="hex">18px</div></div><div class="chip" style="width:96px;"><div style="height:60px;background:var(--surface);border:1px solid var(--hairline);border-radius:22px;"></div><div class="nm">Sheet</div><div class="hex">22px</div></div><div class="chip" style="width:96px;"><div style="height:60px;background:var(--surface);border:1px solid var(--hairline);border-radius:999px;"></div><div class="nm">Pill</div><div class="hex">999px</div></div>
</div></div></body></html>

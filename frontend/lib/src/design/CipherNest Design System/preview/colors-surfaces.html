<!DOCTYPE html>
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font-mono);color:var(--fg-muted);}
</style></head><body><div class="wrap">
<div class="swatches">
<div class="chip"><div class="box" style="background:#110F0A"></div><div class="nm">Background</div><div class="hex">#110F0A</div></div><div class="chip"><div class="box" style="background:#1A1711"></div><div class="nm">Panel</div><div class="hex">#1A1711</div></div><div class="chip"><div class="box" style="background:#221F17"></div><div class="nm">Surface</div><div class="hex">#221F17</div></div><div class="chip"><div class="box" style="background:#2B271D"></div><div class="nm">Surface 2</div><div class="hex">#2B271D</div></div><div class="chip"><div class="box" style="background:#332F23"></div><div class="nm">Hairline</div><div class="hex">#332F23</div></div>
</div></div></body></html>

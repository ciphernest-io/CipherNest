<!DOCTYPE html>
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font-mono);color:var(--fg-muted);}
</style></head><body><div class="wrap">
<div class="swatches">
<div class="chip" style="width:120px;"><div class="box" style="background:#5AA67E"></div><div class="nm">Success</div><div class="hex">#5AA67E</div></div><div class="chip" style="width:120px;"><div class="box" style="background:#E0A33C"></div><div class="nm">Warning</div><div class="hex">#E0A33C</div></div><div class="chip" style="width:120px;"><div class="box" style="background:#D8665E"></div><div class="nm">Danger</div><div class="hex">#D8665E</div></div><div class="chip" style="width:120px;"><div class="box" style="background:#6E94C4"></div><div class="nm">Info</div><div class="hex">#6E94C4</div></div>
</div></div></body></html>

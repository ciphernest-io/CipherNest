<!DOCTYPE html>
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font-mono);color:var(--fg-muted);}
</style></head><body><div class="wrap">
<div class="swatches">
<div class="chip"><div class="box" style="background:#F6F4EC"></div><div class="nm">Background</div><div class="hex">#F6F4EC</div></div><div class="chip"><div class="box" style="background:#ECEADF"></div><div class="nm">Panel</div><div class="hex">#ECEADF</div></div><div class="chip"><div class="box" style="background:#FCFBF5"></div><div class="nm">Surface</div><div class="hex">#FCFBF5</div></div><div class="chip"><div class="box" style="background:#E1DECF"></div><div class="nm">Hairline</div><div class="hex">#E1DECF</div></div><div class="chip"><div class="box" style="background:#1B1A12"></div><div class="nm">Text</div><div class="hex">#1B1A12</div></div>
</div></div></body></html>

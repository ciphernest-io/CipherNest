<!DOCTYPE html>
<html data-theme="corporate" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);}
.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.top{display:flex;align-items:center;gap:12px;}
.mark{height:26px;width:28px;background:var(--accent);-webkit-mask:url(../assets/logo_mark_white.png) center/contain no-repeat;mask:url(../assets/logo_mark_white.png) center/contain no-repeat;}
.wm{font-family:"Bungee Hairline",sans-serif;font-weight:800;font-size:24px;}
.wm b{color:var(--accent);font-weight:800;}
.row{display:flex;gap:8px;align-items:center;}
.sw{height:34px;flex:1;border-radius:8px;border:1px solid var(--hairline);}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{height:38px;padding:0 16px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);border:none;font:600 13px/1 var(--font);display:inline-flex;align-items:center;gap:6px;}
.pill{height:26px;padding:0 11px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent);font:600 12px/1 var(--font);display:inline-flex;align-items:center;gap:5px;}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:12px 14px;display:flex;align-items:center;gap:11px;}
.ic{width:38px;height:38px;border-radius:var(--r-ic);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.ic .mi{font-size:21px;}
.meta{font:400 12px/1.4 var(--font-mono,var(--font));color:var(--fg-muted);}
.name{font:600 15px/1 var(--font);}
</style></head>
<body><div class="wrap">
  <div class="top"><span class="mark"></span><span class="wm">Cipher<b>Nest</b></span><span style="margin-left:auto" class="pill"><span class="mi fill">lock</span>Corporate</span></div>
  <div class="row">
    <div class="sw" style="background:var(--bg)"></div><div class="sw" style="background:var(--panel)"></div>
    <div class="sw" style="background:var(--surface)"></div><div class="sw" style="background:var(--surface-2)"></div>
    <div class="sw" style="background:var(--accent)"></div>
  </div>
  <div class="card"><div class="ic"><span class="mi">image</span></div>
    <div style="flex:1"><div class="name">Photos &amp; Videos</div><div class="meta">Google Sans Flex · Sharp · 300</div></div>
    <span class="mi" style="color:var(--fg-faint)">chevron_right</span></div>
  <div class="chips"><button class="btn"><span class="mi">add</span>Upload</button><span class="pill"><span class="mi fill">verified</span>AES-256</span><span class="meta">Corporate theme</span></div>
</div></body></html>

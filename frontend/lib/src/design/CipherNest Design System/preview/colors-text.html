<!DOCTYPE html>
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font-mono);color:var(--fg-muted);}
</style></head><body><div class="wrap">
<div class="swatches">
<div class="chip"><div class="box" style="background:var(--surface);display:flex;align-items:center;justify-content:center;color:#F3F0E6;font:600 17px/1 var(--font)">Aa</div><div class="nm">Primary</div><div class="hex">#F3F0E6</div></div><div class="chip"><div class="box" style="background:var(--surface);display:flex;align-items:center;justify-content:center;color:#C4C0B1;font:600 17px/1 var(--font)">Aa</div><div class="nm">Secondary</div><div class="hex">#C4C0B1</div></div><div class="chip"><div class="box" style="background:var(--surface);display:flex;align-items:center;justify-content:center;color:#908B7B;font:600 17px/1 var(--font)">Aa</div><div class="nm">Muted</div><div class="hex">#908B7B</div></div><div class="chip"><div class="box" style="background:var(--surface);display:flex;align-items:center;justify-content:center;color:#615C4D;font:600 17px/1 var(--font)">Aa</div><div class="nm">Faint</div><div class="hex">#615C4D</div></div>
</div></div></body></html>

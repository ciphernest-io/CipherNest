<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base scale" viewport="700x180" -->
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.sw{display:flex;flex-direction:column;gap:7px;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font);color:var(--fg-muted);font-family:var(--font-mono);}
</style></head><body><div class="wrap">
<div style="display:flex;flex-direction:column;gap:9px;">
<div style="display:flex;align-items:center;gap:12px;"><span class="hex" style="width:48px;">sp-1</span><div style="height:14px;width:12px;background:var(--accent);border-radius:3px;"></div><span class="hex">4px</span></div><div style="display:flex;align-items:center;gap:12px;"><span class="hex" style="width:48px;">sp-2</span><div style="height:14px;width:24px;background:var(--accent);border-radius:3px;"></div><span class="hex">8px</span></div><div style="display:flex;align-items:center;gap:12px;"><span class="hex" style="width:48px;">sp-3</span><div style="height:14px;width:36px;background:var(--accent);border-radius:3px;"></div><span class="hex">12px</span></div><div style="display:flex;align-items:center;gap:12px;"><span class="hex" style="width:48px;">sp-4</span><div style="height:14px;width:48px;background:var(--accent);border-radius:3px;"></div><span class="hex">16px</span></div><div style="display:flex;align-items:center;gap:12px;"><span class="hex" style="width:48px;">sp-6</span><div style="height:14px;width:72px;background:var(--accent);border-radius:3px;"></div><span class="hex">24px</span></div><div style="display:flex;align-items:center;gap:12px;"><span class="hex" style="width:48px;">sp-8</span><div style="height:14px;width:96px;background:var(--accent);border-radius:3px;"></div><span class="hex">32px</span></div>
</div></div></body></html>

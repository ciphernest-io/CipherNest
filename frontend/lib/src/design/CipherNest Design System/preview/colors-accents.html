<!DOCTYPE html>
<html data-theme="binary" data-mode="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>html,body{margin:0;background:var(--bg);}
.wrap{padding:18px 20px;font-family:var(--font);color:var(--fg);}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.chip{width:120px;}
.chip .box{height:54px;border-radius:10px;border:1px solid var(--hairline);}
.chip .nm{font:600 12px/1.2 var(--font);margin-top:7px;}
.chip .hex{font:400 11px/1.2 var(--font-mono);color:var(--fg-muted);}
</style></head><body><div class="wrap">
<div class="swatches">
<div class="chip" style="width:96px;"><div class="box" style="background:#C2A15A"></div><div class="nm">Brass</div><div class="hex">#C2A15A</div></div><div class="chip" style="width:96px;"><div class="box" style="background:#5BA086"></div><div class="nm">Jade</div><div class="hex">#5BA086</div></div><div class="chip" style="width:96px;"><div class="box" style="background:#C2734C"></div><div class="nm">Clay</div><div class="hex">#C2734C</div></div><div class="chip" style="width:96px;"><div class="box" style="background:#6E8FBE"></div><div class="nm">Slate</div><div class="hex">#6E8FBE</div></div><div class="chip" style="width:96px;"><div class="box" style="background:#A06E92"></div><div class="nm">Plum</div><div class="hex">#A06E92</div></div><div class="chip" style="width:96px;"><div class="box" style="background:#C25C44"></div><div class="nm">Rust</div><div class="hex">#C25C44</div></div>
</div></div></body></html>

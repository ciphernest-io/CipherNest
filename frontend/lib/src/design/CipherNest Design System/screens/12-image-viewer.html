<!DOCTYPE html>
<!-- @dsCard group="Screens" name="Image Viewer" subtitle="Immersive black, filmstrip" viewport="412x915" -->
<html data-theme="binary" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Viewer · CipherNest</title>
<link rel="stylesheet" href="../themes.css">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="../motion.css">
<link rel="stylesheet" href="../fonts/material.css">
<style>
  html,body{background:#000;margin:0;display:flex;justify-content:center;}
  .phone.viewer{ background:#000; }
  .v-top{ position:absolute; top:0; left:0; right:0; z-index:20; height:96px; padding-top:44px; display:flex; align-items:center; gap:4px; padding-left:6px; padding-right:10px; background:linear-gradient(to bottom, rgba(0,0,0,0.62), transparent); }
  .v-top .fn{ flex:1; text-align:center; }
  .v-top .fn .name{ font:600 14px/1.2 var(--font); color:#fff; }
  .v-top .fn .sub{ font:400 11px/1 var(--font); color:rgba(255,255,255,0.6); margin-top:3px; }
  .v-top .iconbtn{ color:#fff; }
  .v-stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .v-stage img{ max-width:100%; max-height:100%; object-fit:contain; }
  .v-bottom{ position:absolute; left:0; right:0; bottom:0; z-index:20; padding:18px 0 26px; background:linear-gradient(to top, rgba(0,0,0,0.72), transparent); }
  .v-actions{ display:flex; justify-content:space-around; padding:0 28px 16px; }
  .v-actions .iconbtn{ color:#fff; font-size:24px; flex-direction:column; gap:5px; height:auto; width:auto; }
  .v-actions .iconbtn span{ font:500 10px/1 var(--font); color:rgba(255,255,255,0.7); }
  .strip{ display:flex; gap:4px; overflow-x:auto; padding:0 calc(50% - 20px); align-items:center; }
  .strip .th{ flex:0 0 auto; width:40px; height:40px; border-radius:7px; overflow:hidden; opacity:0.55; transition:.2s; }
  .strip .th img{ width:100%;height:100%;object-fit:cover; }
  .strip .th.cur{ width:54px; height:54px; opacity:1; outline:2px solid var(--accent); outline-offset:1px; border-radius:9px; }
  .swipehint{ position:absolute; top:108px; left:50%; transform:translateX(-50%); z-index:15; color:rgba(255,255,255,0.4); font-size:11px; display:flex;align-items:center;gap:5px; }
</style>
</head>
<body>
<div class="phone viewer" data-screen-label="Image Viewer">
  <div class="v-stage"><img src="https://picsum.photos/seed/cnA2/900/1300"></div>
  <div class="v-top">
    <button class="iconbtn"><span class="mi">arrow_back</span></button>
    <div class="fn"><div class="name">IMG_4821.heic</div><div class="sub">May 18, 2026 · 12.4 MP</div></div>
    <button class="iconbtn"><span class="mi">more_vert</span></button>
  </div>
  <div class="v-bottom">
    <div class="v-actions">
      <button class="iconbtn"><span class="mi">share</span><span>Share</span></button>
      <button class="iconbtn"><span class="mi">star</span><span>Favorite</span></button>
      <button class="iconbtn"><span class="mi">info</span><span>Details</span></button>
      <button class="iconbtn"><span class="mi">delete</span><span>Delete</span></button>
    </div>
    <div class="strip" id="strip"></div>
  </div>
</div>
<script>
  const strip=document.getElementById('strip');
  let h='';
  for(let i=0;i<14;i++){ h+=`<div class="th ${i===5?'cur':''}"><img src="https://picsum.photos/seed/cnA${i}/120/120"></div>`; }
  strip.innerHTML=h;
  const cur=strip.querySelector('.cur');
  if(cur) strip.scrollLeft = cur.offsetLeft - strip.clientWidth/2 + cur.offsetWidth/2;
</script>
<script src="../theme-switch.js"></script>
</body>
</html>

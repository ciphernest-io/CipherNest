<!DOCTYPE html>
<!-- @dsCard group="UI Kit — App" name="App UI Kit" subtitle="Interactive prototype: unlock → vault → gallery → viewer" viewport="412x760" -->
<html data-theme="binary" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CipherNest · App UI Kit</title>
<link rel="stylesheet" href="../../themes.css">
<link rel="stylesheet" href="../../app.css">
<link rel="stylesheet" href="../../motion.css">
<link rel="stylesheet" href="../../fonts/material.css">
<style>
  html,body{ margin:0; background:#0D0D10; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  #root{ box-shadow:0 24px 80px rgba(0,0,0,0.5); border-radius:20px; overflow:hidden; }
  /* app-specific composites used by the kit */
  .acct-chip{ display:inline-flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border-radius:999px; background:var(--surface); border:1px solid var(--hairline); font:500 13px/1 var(--font); cursor:pointer; }
  .acct-chip .av{ width:24px;height:24px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600; }
  .vcard{ display:flex; align-items:center; gap:16px; padding:18px; cursor:pointer; transition:background .15s ease; }
  .vcard:hover{ background:var(--surface-2); }
  .vcard-ic{ width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto; }
  .vcard-main{ flex:1; }
  .vcard-t{ font:600 17px/1.2 var(--font); }
  .vcard-s{ color:var(--fg-muted); font-size:13px; margin-top:4px; }
  .minithumbs{ display:flex; gap:3px; }
  .minithumbs img{ width:38px;height:38px;border-radius:8px;object-fit:cover; }
  .storagebar{ margin:4px 20px 0; padding:16px; border-radius:var(--r-card); background:var(--surface); border:1px solid var(--hairline); }
  .storagebar .top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .meter{ height:7px; border-radius:999px; background:var(--surface-2); margin-top:11px; overflow:hidden; display:flex; }
  .meter i{ display:block; height:100%; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script src="../../theme-switch.js"></script>
</body>
</html>

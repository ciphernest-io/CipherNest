org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation relativizes plugin-source paths (pub cache on
# C:) against the module dir (project on D:). On Windows, different drive roots
# crash the Kotlin daemon with "this and base files have different roots". The
# Kotlin here is only rarely-changing plugin code, so disabling incremental is
# effectively free and lets release builds work with project and pub cache on
# different drives (project moved E: -> D:, Nov 2026).
kotlin.incremental=false
